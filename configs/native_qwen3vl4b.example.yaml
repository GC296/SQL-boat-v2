llm:
  model: "Qwen/Qwen3-VL-4B-AWQ"
  api_key: "YOUR_API_KEY"
  base_url: "http://localhost:7890/v1"

native_vlm:
  parameters: "4B"
  quantization: "AWQ INT4"
  input_mode: "video_url"  # video_url | sampled_frames
  use_file_url: true
  temperature: 0.0
  max_tokens: 4096
  max_retries: 0
  request_timeout_seconds: 600
  enable_thinking: false
  json_response_format: true

  # Used only when input_mode=sampled_frames.
  sample_fps: 1.0
  max_frames: 64
  image_max_side: 896
  jpeg_quality: 85
